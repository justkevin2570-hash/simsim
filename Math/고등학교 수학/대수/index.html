<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대수 | 수학 교사는 심심했다</title>
    <link rel="stylesheet" href="../../../style.css">
    <link rel="icon" href="../../../favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="../../../favicon.svg">
    <link rel="apple-touch-icon" href="../../../apple-touch-icon.png">
</head>
<body>
    <a class="back" href="../">← 고등학교 수학</a>

    <header class="page-header">
        <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 3v17h17z"/><path d="M8 11v5h5z"/><path d="M4 7h1.6M4 11h1.6M4 15h1.6"/></svg></div>
        <h1>대수</h1>
        <p class="sub">대단원을 선택하세요</p>
    </header>

    <main>
        <div class="list">
            <span class="list-item disabled"><span><span class="num">Ⅰ.</span>지수함수와 로그함수</span> <small>준비 중</small></span>
            <span class="list-item disabled"><span><span class="num">Ⅱ.</span>삼각함수</span> <small>준비 중</small></span>
            <div class="group">
                <button class="list-item" aria-expanded="false">
                    <span><span class="num">Ⅲ.</span>수열</span>
                    <span class="chev" aria-hidden="true">›</span>
                </button>
                <div class="sub-list">
                    <span class="sub-item disabled">등차수열 <small>준비 중</small></span>
                    <span class="sub-item disabled">등비수열 <small>준비 중</small></span>
                    <span class="sub-item disabled">여러 가지 수열의 합 <small>준비 중</small></span>
                    <a class="sub-item" href="수열/수학적귀납법.html">수학적 귀납법 <small aria-hidden="true">→</small></a>
                </div>
            </div>
        </div>
    </main>

    <footer>since 2026</footer>

    <script>
        document.querySelectorAll('.group > button').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var open = btn.parentElement.classList.toggle('open');
                btn.setAttribute('aria-expanded', open);
            });
        });
    </script>
</body>
</html>
