<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 교사는 심심했다</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
    <header class="page-header">
        <h1>수학 교사는 심심했다</h1>
        <p class="sub">무언가를 만들고 나누는 곳</p>
    </header>

    <main>
        <!-- 수학 -->
        <section class="menu math">
            <button class="menu-head" aria-expanded="false">
                <span class="icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
                        <path d="M4 3v17h17z"/><path d="M8 11v5h5z"/><path d="M4 7h1.6M4 11h1.6M4 15h1.6"/>
                    </svg>
                </span>
                <span><span class="title">수학</span><span class="desc">수업과 평가 자료</span></span>
                <span class="chev" aria-hidden="true">›</span>
            </button>
            <div class="sub-list">
                <a class="sub-item" href="Math/assessment.html">수행평가 <small aria-hidden="true">→</small></a>
                <a class="sub-item" href="Math/essay.html">서·논술형 문항 <small aria-hidden="true">→</small></a>            </div>
        </section>

        <!-- 개발 앱 -->
        <section class="menu app">
            <button class="menu-head" aria-expanded="false">
                <span class="icon" aria-hidden="true">✦</span>
                <span><span class="title">개발 앱</span><span class="desc">심심해서 만든 것들</span></span>
                <span class="chev" aria-hidden="true">›</span>
            </button>
            <div class="sub-list">
                <div class="sub-item app-item">
                    <span class="app-name">서서니 노트</span>
                    <span class="app-meta"><span class="app-desc">교직원 업무용 노트 앱</span><span class="badge windows">Windows</span></span>
                    <!-- 항상 최신 릴리스의 설치 파일을 받음 -->
                    <a class="get get-dl" href="https://github.com/justkevin2570-hash/SSNnote/releases/latest/download/SSNnote_Setup.exe" aria-label="서서니 노트 Windows 설치 파일 받기">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>받기
                    </a>
                </div>
                <div class="sub-item app-item">
                    <span class="app-name">Symmetry Rush</span>
                    <span class="app-meta"><span class="app-desc">대칭이동 퍼즐 게임</span><span class="badge android">Android</span></span>
                    <span class="get get-soon">출시 예정</span>
                </div>
                <div class="sub-item app-item placeholder">
                    <span class="app-name">무언가 준비중1</span>
                    <span class="app-meta"><span class="app-desc">곧 공개됩니다</span></span>
                    <span class="get get-soon">준비 중</span>
                </div>
                <div class="sub-item app-item placeholder">
                    <span class="app-name">무언가 준비중2</span>
                    <span class="app-meta"><span class="app-desc">곧 공개됩니다</span></span>
                    <span class="get get-soon">준비 중</span>
                </div>
            </div>
        </section>

        <!-- 동료교사 사이트 -->
        <section class="menu etc">
            <button class="menu-head" aria-expanded="false">
                <span class="icon" aria-hidden="true">♡</span>
                <span><span class="title">동료교사 사이트</span><span class="desc">함께 보면 좋은 곳</span></span>
                <span class="chev" aria-hidden="true">›</span>
            </button>
            <div class="sub-list">
                <div class="peer-row">
                    <span class="icon fe-logo" aria-hidden="true">f.</span>
                    <span>
                        <span class="peer-name fe-name">foreducator</span>
                        <span class="peer-one">선생님 곁의 작은 동료</span>
                    </span>
                    <a class="btn primary peer-open" href="https://www.foreducator.com/" target="_blank" rel="noopener noreferrer">열기 ↗</a>
                </div>
            </div>
        </section>
    </main>

    <footer>since 2026</footer>

    <script>
        document.querySelectorAll('button.menu-head').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var open = btn.parentElement.classList.toggle('open');
                btn.setAttribute('aria-expanded', open);
            });
        });

        // 휴대폰·태블릿에서는 Windows 설치 파일을 받아도 쓸 수 없으니 누를 수 없는 "PC 전용" 표시로 바꿈
        (function () {
            var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // 아이패드
            if (!isMobile) return;
            document.querySelectorAll('.get-dl').forEach(function (a) {
                var label = document.createElement('span');
                label.className = 'get get-soon';
                label.textContent = 'PC 전용';
                a.replaceWith(label);
            });
        })();
    </script>
</body>
</html>
