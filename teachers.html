<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
    <a class="back" href="index.html">← 처음으로</a>

    <header class="page-header">
        <div class="mark neutral">♡</div>
        <h1>동료교사 사이트</h1>
        <p class="sub">동료 선생님들이 만든 유용한 사이트들</p>
    </header>

    <main>
        <!-- Foreducator -->
        <article class="peer">
            <div class="peer-top">
                <span class="icon">✎</span>
                <div>
                    <div class="peer-name">Foreducator</div>
                    <div class="peer-one">교사 업무와 수업 도구를 한곳에 모은 사이트</div>
                </div>
                <a class="btn primary peer-open" href="https://www.foreducator.com/" target="_blank" rel="noopener noreferrer">열기 ↗</a>
            </div>
            <div class="peer-links">
                <a class="peer-link" href="https://www.foreducator.com/workmate" target="_blank" rel="noopener noreferrer">
                    <span>워크메이트<span class="peer-sub">생기부·채점·문서 등 업무 도구</span></span><small>↗</small>
                </a>
                <a class="peer-link" href="https://www.foreducator.com/classmate" target="_blank" rel="noopener noreferrer">
                    <span>클래스메이트<span class="peer-sub">게임·퀴즈 등 수업 도구</span></span><small>↗</small>
                </a>
            </div>
        </article>

        <div class="note">좋은 사이트가 생기면 더할게요</div>
    </main>

    <footer>since 2026</footer>
